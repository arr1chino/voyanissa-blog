# ============================================================
# r118 上线前精简：这张表里的每一条，主题的打包器（hexo-butterfly-extjs）
# 都会整包拷进 public/pluginsSrc/ —— 不管页面有没有引用。
# 本站真正用到的只有下面三个：
#   fontawesome      → 全站图标（放大镜、月亮、回到顶部…）
#   sharejs/_css     → 文章页底部的分享按钮
# 其余条目（数学公式 / 流程图 / 评论 / 文档搜索 / 图表 / 图片灯箱 /
# 代码高亮 / 点击特效 / 搜索 / 提示条 …）在 _config.yml 里全部是关闭的，
# 页面里一个 <script> 都没引用它们，删掉纯粹是给访客省流量。
# 哪天真要用（比如文章里要画流程图、要开本地搜索），
# 把对应的几行加回来再重新构建即可 —— 加回来之前记得先把 _config.yml 里
# 那个功能打开，否则加了也还是不会加载。
# ============================================================
fontawesome:
  name: '@fortawesome/fontawesome-free'
  file: css/all.min.css
  other_name: font-awesome
  version: 7.3.1
sharejs:
  name: butterfly-extsrc
  file: sharejs/dist/js/social-share.min.js
  version: 1.1.6
sharejs_css:
  name: butterfly-extsrc
  file: sharejs/dist/css/share.min.css
  version: 1.1.6
